<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The controverse</title>
<meta name="description" content="The controverse: build a portrait from the features of world figures.">
<meta name="theme-color" content="#0b0b0d">
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="preconnect" href="https://api.github.com" crossorigin>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0d;
    --surface: #151518;
    --raised: #1d1d21;
    --hover: #26262b;
    --line: rgba(255, 255, 255, .08);
    --line-strong: rgba(255, 255, 255, .16);
    --text: #f3f3f5;
    --text-2: #c7c7cd;
    --muted: #8b8b94;
    --faint: #5c5c64;
    --accent: #5b8cff;
    --accent-hover: #7aa2ff;
    --accent-soft: rgba(91, 140, 255, .16);
    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 22px;
    --header-h: 60px;
    --gap: 20px;
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 24px 48px -24px rgba(0,0,0,.7);
    --stage-bg: #f4f1ed;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    height: var(--header-h);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    background: rgba(11, 11, 13, .82);
    backdrop-filter: saturate(160%) blur(16px);
    -webkit-backdrop-filter: saturate(160%) blur(16px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    background: conic-gradient(from 200deg, #d9b8a8, #9fb6a4, #8aa2c4, #b49ab8, #d9b8a8);
    position: relative;
  }
  .brand-mark::after { content: ""; position: absolute; inset: 7px 9px 7px 7px; border-radius: 3px 3px 2px 2px; background: var(--bg); }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.015em; white-space: nowrap; }
  .brand small { color: var(--muted); font-size: 12px; font-weight: 500; margin-left: 2px; }
  .top-actions { display: flex; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    height: 36px; padding: 0 14px;
    border-radius: 999px;
    font-size: 13px; font-weight: 600; letter-spacing: -.005em;
    transition: background-color .15s, transform .1s, color .15s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .btn-ghost { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .btn-ghost:hover { background: var(--hover); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  @media (max-width: 480px) {
    .brand small { display: none; }
    .btn-label { display: none; }
    .btn { width: 36px; padding: 0; }
  }

  /* ---------- Workspace ---------- */
  .workspace {
    flex: 1;
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    padding: var(--gap) max(16px, env(safe-area-inset-right)) calc(var(--gap) + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: grid;
    gap: var(--gap);
    grid-template-columns: minmax(0, 1fr);
  }
  @media (min-width: 960px) {
    body { height: 100vh; height: 100dvh; overflow: hidden; }
    .workspace {
      --gap: 24px;
      min-height: 0;
      --stage: min(calc(100dvh - var(--header-h) - 2 * var(--gap) - 92px), calc(100vw - 480px - 3 * var(--gap)), 860px);
      grid-template-columns: var(--stage) minmax(380px, 1fr);
      padding-left: var(--gap); padding-right: var(--gap);
    }
  }

  /* Stage */
  .stage-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .stage {
    position: relative;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: var(--r-lg);
    overflow: hidden;
    background: var(--stage-bg);
    box-shadow: var(--shadow);
    transition: background-color .35s ease;
  }
  .stage img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none; user-select: none;
  }
  .stage-caption {
    position: absolute; left: 14px; bottom: 14px; z-index: 5;
    max-width: calc(100% - 28px);
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(12, 12, 14, .55);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: #fff; font-size: 12px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transform: translateY(4px);
    transition: opacity .25s, transform .25s;
  }
  .stage-caption.show { opacity: 1; transform: none; }
  .loader {
    position: absolute; right: 16px; top: 16px; z-index: 5;
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(0,0,0,.12); border-top-color: rgba(0,0,0,.5);
    animation: spin .7s linear infinite;
    opacity: 0; transition: opacity .15s;
  }
  .stage.loading .loader { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Background swatches */
  .swatch-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    min-width: 0;
  }
  .swatch-label { flex-shrink: 0; width: 104px; }
  .swatch-label span { display: block; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  .swatch-label strong { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .swatches {
    display: flex; gap: 6px;
    overflow-x: auto;
    padding: 4px 2px;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 12px, #000 calc(100% - 24px), transparent);
            mask-image: linear-gradient(90deg, transparent, #000 12px, #000 calc(100% - 24px), transparent);
    padding-left: 10px; padding-right: 24px;
  }
  .swatches::-webkit-scrollbar { display: none; }
  .swatch {
    flex-shrink: 0;
    width: 26px; height: 26px; border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
    transition: transform .12s, box-shadow .12s;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch[aria-checked="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }

  /* ---------- Inspector ---------- */
  .inspector {
    display: flex; flex-direction: column;
    min-height: 0; min-width: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    overflow: hidden;
  }
  .inspector-head { padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px; }

  .search { position: relative; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  #search-input {
    width: 100%; height: 40px;
    padding: 0 12px 0 36px;
    background: var(--raised);
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    font-size: 14px;
    outline: none;
    transition: border-color .15s, background-color .15s;
  }
  #search-input::placeholder { color: var(--faint); }
  #search-input:focus { border-color: var(--accent); background: var(--bg); }
  #search-suggestions {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30;
    max-height: 320px; overflow-y: auto;
    margin: 0; padding: 6px; list-style: none;
    background: var(--raised);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    box-shadow: 0 20px 40px -12px rgba(0,0,0,.8);
  }
  .suggestion {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px; border-radius: 8px;
    font-size: 13px; color: var(--text-2); cursor: pointer;
  }
  .suggestion .s-thumb { width: 32px; height: 32px; border-radius: 7px; flex-shrink: 0; overflow: hidden; position: relative; background: var(--stage-bg); }
  .suggestion .s-text { min-width: 0; flex: 1; }
  .suggestion .s-name { display: block; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .suggestion .s-hint { display: block; font-size: 11px; color: var(--muted); }
  .suggestion .s-tag { flex-shrink: 0; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 3px 7px; border-radius: 999px; }
  .suggestion.active, .suggestion:hover { background: var(--hover); }
  .suggestion.empty { color: var(--muted); cursor: default; justify-content: center; padding: 12px; }
  .suggestion.empty:hover { background: none; }

  /* Tabs */
  .tabs {
    display: flex; gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    margin: 0 -16px; padding: 0 16px;
    border-bottom: 1px solid var(--line);
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    position: relative;
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    width: 68px;
    padding: 4px 0 12px;
    color: var(--muted);
    font-size: 12px; font-weight: 600;
    transition: color .15s;
  }
  .tab:hover { color: var(--text-2); }
  .tab-thumb {
    position: relative;
    width: 44px; height: 44px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--raised);
    box-shadow: inset 0 0 0 1px var(--line);
    transition: box-shadow .15s;
  }
  .tab-thumb.empty::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; border: 1.5px dashed var(--faint); }
  .tab[aria-selected="true"] { color: var(--text); }
  .tab[aria-selected="true"] .tab-thumb { box-shadow: 0 0 0 2px var(--accent); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }

  .section-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px 10px;
  }
  .section-head h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .section-head h2 span { color: var(--muted); font-weight: 500; margin-left: 4px; }
  .mini-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; color: var(--text-2);
    background: var(--raised);
  }
  .mini-btn:hover { background: var(--hover); color: var(--text); }
  .mini-btn svg { width: 14px; height: 14px; }

  /* Grid */
  .grid-wrap { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 16px; scrollbar-width: thin; scrollbar-color: var(--hover) transparent; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap: 10px;
  }
  @media (max-width: 959px) { .grid { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; } }
  .tile {
    display: flex; flex-direction: column; gap: 6px;
    min-width: 0;
    text-align: left;
  }
  .tile-img {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: var(--r-md);
    overflow: hidden;
    background: var(--stage-bg);
    box-shadow: inset 0 0 0 1px var(--line);
    transition: box-shadow .15s, transform .15s, background-color .35s;
  }
  .tile:hover .tile-img { transform: translateY(-2px); }
  .tile[aria-checked="true"] .tile-img { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .tile-name {
    font-size: 12px; font-weight: 500; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 0 2px;
  }
  .tile[aria-checked="true"] .tile-name { color: var(--text); font-weight: 600; }
  .tile-none .tile-img { background: var(--raised); display: grid; place-items: center; }
  .tile-none svg { width: 26px; height: 26px; color: var(--faint); }
  .check {
    position: absolute; right: 6px; top: 6px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    transform: scale(0); transition: transform .18s cubic-bezier(.3,1.6,.6,1);
  }
  .check svg { width: 12px; height: 12px; }
  .tile[aria-checked="true"] .check { transform: scale(1); }

  /* Cropped part preview (used in tiles, tabs and search) */
  .crop { position: absolute; max-width: none; pointer-events: none; user-select: none; }
  .crop.fade { opacity: 0; transition: opacity .25s; }
  .crop.loaded { opacity: 1; }

  /* Phones & tablets: app layout — portrait on top, picker fills the rest and scrolls */
  @media (max-width: 959px) {
    body { height: 100vh; height: 100dvh; overflow: hidden; }
    .workspace { --gap: 12px; display: flex; flex-direction: column; min-height: 0; max-width: 620px; }
    .stage-col { align-items: center; flex-shrink: 0; gap: 10px; }
    .stage { width: min(100%, 40vh); width: min(100%, 40dvh); --r-lg: 18px; }
    .swatch-bar { width: 100%; padding: 6px 10px; }
    .swatch-label { width: 92px; }
    .inspector { flex: 1; --r-lg: 18px; }
    .inspector-head { padding: 12px 12px 0; gap: 10px; }
    .tabs { margin: 0 -12px; padding: 0 12px; }
    .section-head { padding: 10px 12px 8px; }
    .grid-wrap { padding: 0 12px 12px; }
    .tab { width: 64px; font-size: 11px; white-space: nowrap; }
    .tab-thumb { width: 38px; height: 38px; }
  }

  /* ---------- Share dialog ---------- */
  dialog {
    width: min(92vw, 420px);
    padding: 0;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-lg);
    box-shadow: 0 40px 80px -20px rgba(0,0,0,.9);
    overflow: hidden;
  }
  dialog[open] { animation: pop .22s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(8px); } }
  dialog::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .dlg-body { padding: 20px; }
  .dlg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .dlg-head h2 { margin: 0 0 2px; font-size: 18px; font-weight: 650; letter-spacing: -.015em; }
  .dlg-head p { margin: 0; font-size: 13px; color: var(--muted); }
  .close { width: 30px; height: 30px; border-radius: 50%; background: var(--raised); color: var(--muted); display: grid; place-items: center; flex-shrink: 0; }
  .close:hover { background: var(--hover); color: var(--text); }
  .close svg { width: 14px; height: 14px; }
  #share-preview { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--r-md); background: var(--raised); margin-bottom: 16px; }
  .share-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .share-btn {
    display: flex; align-items: center; gap: 10px;
    height: 44px; padding: 0 12px;
    border-radius: var(--r-sm);
    background: var(--raised);
    font-size: 13px; font-weight: 600; color: var(--text);
    text-decoration: none;
    transition: background-color .15s;
  }
  .share-btn:hover { background: var(--hover); }
  .share-btn .ico { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex-shrink: 0; color: #fff; }
  .share-btn .ico svg { width: 15px; height: 15px; }
  .share-btn.wide { grid-column: 1 / -1; justify-content: center; background: var(--accent); color: #fff; }
  .share-btn.wide:hover { background: var(--accent-hover); }
  .share-btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
  .ico.ig { background: linear-gradient(45deg, #f09433, #dc2743 50%, #bc1888); }
  .ico.x { background: #000; box-shadow: inset 0 0 0 1px var(--line-strong); }
  .ico.li { background: #0a66c2; }
  .ico.cp { background: #3a3a40; }
  #share-status { min-height: 1.4em; margin: 12px 0 0; font-size: 12px; color: var(--accent-hover); text-align: center; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>The controverse <small>Portrait Builder</small></h1>
  </div>
  <div class="top-actions">
    <button id="shuffle-button" class="btn btn-ghost" type="button" title="Shuffle (S)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg>
      <span class="btn-label">Shuffle</span>
    </button>
    <button id="share-button" class="btn btn-primary" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
      <span class="btn-label">Share</span>
    </button>
  </div>
</header>

<main class="workspace">
  <section class="stage-col" aria-label="Portrait">
    <div id="display-box" class="stage" role="img" aria-label="Portrait preview">
      <div id="layers"></div>
      <div class="loader" aria-hidden="true"></div>
      <div id="stage-caption" class="stage-caption" aria-hidden="true"></div>
    </div>
    <div class="swatch-bar">
      <div class="swatch-label"><span>Background</span><strong id="bg-name">Bone</strong></div>
      <div id="swatches" class="swatches" role="radiogroup" aria-label="Background colour"></div>
    </div>
  </section>

  <section class="inspector" aria-label="Choose features">
    <div class="inspector-head">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="search-input" placeholder="Search a figure, e.g. Einstein" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-controls="search-suggestions" aria-autocomplete="list">
        <ul id="search-suggestions" role="listbox" hidden></ul>
      </div>
      <div id="tabs" class="tabs" role="tablist" aria-label="Feature"></div>
    </div>
    <div class="section-head">
      <h2 id="section-title">Hair</h2>
      <button id="shuffle-one" class="mini-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/></svg>
        <span>Random</span>
      </button>
    </div>
    <div class="grid-wrap" id="grid-wrap">
      <div id="grid" class="grid" role="radiogroup" aria-labelledby="section-title"></div>
    </div>
  </section>
</main>

<dialog id="share-modal" aria-labelledby="share-title">
  <div class="dlg-body">
    <div class="dlg-head">
      <div>
        <h2 id="share-title">Share your portrait</h2>
        <p>Save it or post it to your socials.</p>
      </div>
      <button class="close" id="close-share-modal" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <img id="share-preview" alt="Your portrait">
    <div class="share-grid">

      const res = await fetch(
        `https://api.github.com/repos/${REPO.owner}/${REPO.name}/git/trees/${REPO.branch}?recursive=1`,
        { signal: ctrl.signal, headers: { Accept: 'application/vnd.github+json' } }
      );
      if (!res.ok) throw new Error(`GitHub API ${res.status}`);
      const data = await res.json();
      const folders = new Set(CATEGORIES.map((c) => c.folder));
      return data.tree
        .filter((n) => n.type === 'blob' && IMAGE_RE.test(n.path) && n.path.split('/').length === 2 && folders.has(n.path.split('/')[0]))
        .map((n) => n.path)
        .sort();
    } finally {
      clearTimeout(timer);
    }
  }

  function buildTraits(paths) {
    const traits = {};
    for (const c of CATEGORIES) traits[c.key] = [];
    const folderToKey = new Map(CATEGORIES.map((c) => [c.folder, c.key]));
    for (const path of paths) {
      const [folder, file] = path.split('/');
      const key = folderToKey.get(folder.toLowerCase());
      if (!key || !file) continue;
      const name = displayName(folder.toLowerCase(), file);
      const list = traits[key];
      if (list.some((t) => t.name === name)) continue;
      list.push({ name, file: file.replace(/\.[^.]+$/, ''), url: urlFor(path), key });
    }
    for (const k in traits) traits[k].sort(byName);

    const characters = new Map();
    for (const c of CATEGORIES) {
      for (const t of traits[c.key]) {
        const lower = t.name.toLowerCase();
        if (!characters.has(lower)) characters.set(lower, { name: t.name, traits: {} });
        characters.get(lower).traits[c.key] = t;
      }
    }
    for (const [k, v] of characters) if (Object.keys(v.traits).length < 2) characters.delete(k);

    // keep current choices where the file still exists
    for (const k in state.sel) {
      const cur = state.sel[k];
      state.sel[k] = cur ? traits[k].find((t) => t.file === cur.file) || null : null;
    }
    state.traits = traits;
    state.characters = characters;
    if (!visibleCats().some((c) => c.key === state.tab)) state.tab = visibleCats()[0]?.key || CATEGORIES[0].key;
  }

  // ---------- cropped thumbnails ----------
  function cropImg(trait, lazy = true) {
    const c = catByKey.get(trait.key).crop;
    const size = c.size;
    const x = Math.min(Math.max(c.x, size / 2), 1 - size / 2);
    const y = Math.min(Math.max(c.y, size / 2), 1 - size / 2);
    const img = document.createElement('img');
    img.className = 'crop fade';
    img.alt = '';
    img.decoding = 'async';
    if (lazy) img.loading = 'lazy';
    img.draggable = false;
    img.style.width = img.style.height = `${100 / size}%`;
    img.style.left = `${-(x - size / 2) / size * 100}%`;
    img.style.top = `${-(y - size / 2) / size * 100}%`;
    img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
    img.addEventListener('error', () => img.remove(), { once: true });
    img.src = trait.url;
    return img;
  }

  // ---------- stage ----------
  function buildLayers() {
    const frag = document.createDocumentFragment();
    for (const key of LAYER_ORDER) {
      const img = document.createElement('img');
      img.alt = '';
      img.crossOrigin = 'anonymous';
      img.decoding = 'async';
      img.draggable = false;
      img.hidden = true;
      img.addEventListener('load', updateLoading);
      img.addEventListener('error', () => { console.warn('Could not load', img.src); img.hidden = true; updateLoading(); });
      if (key === 'shade') { img.src = SHADE_URL; img.hidden = false; }
      state.layers[key] = img;
      frag.appendChild(img);
    }
    els.layers.appendChild(frag);
  }

  function updateLoading() {
    const pending = Object.values(state.layers).some((img) => !img.hidden && img.getAttribute('src') && !img.complete);
    els.stage.classList.toggle('loading', pending);
  }

  function renderStage() {
    for (const c of CATEGORIES) {
      const img = state.layers[c.key];
      const t = state.sel[c.key];
      if (!t) { img.hidden = true; img.removeAttribute('src'); continue; }
      if (img.getAttribute('src') !== t.url) img.src = t.url;
      img.hidden = false;
    }
    const bg = bgByName.get(state.bg) || bgByName.get(DEFAULT_BACKGROUND) || BACKGROUNDS[0];
    document.documentElement.style.setProperty('--stage-bg', bg.color);
    els.bgName.textContent = bg.name;
    const parts = describe();
    els.stage.setAttribute('aria-label', `Portrait: ${parts.join(', ') || 'empty'}`);
    updateLoading();
  }

  // Say who the portrait is when every main part comes from one figure
  function updateCaption() {
    const names = CATEGORIES.filter((c) => !c.optional && state.traits[c.key].length)
      .map((c) => state.sel[c.key]?.name).filter(Boolean);
    const unique = [...new Set(names)];
    let text = '';
    if (names.length && unique.length === 1) text = unique[0];
    else if (unique.length > 1) text = `Mix of ${unique.length} figures`;
    els.caption.textContent = text;
    els.caption.classList.toggle('show', !!text);
  }

  function describe() {
    return CATEGORIES.map((c) => state.sel[c.key]?.name).filter(Boolean);
  }

  // ---------- swatches ----------
  function buildSwatches() {
    const frag = document.createDocumentFragment();
    for (const b of BACKGROUNDS) {
      const s = document.createElement('button');
      s.type = 'button';
      s.className = 'swatch';
      s.style.background = b.color;
      s.title = b.name;
      s.setAttribute('role', 'radio');
      s.setAttribute('aria-label', b.name);
      s.dataset.name = b.name;
      s.addEventListener('click', () => { state.touched = true; setBackground(b.name); });
      frag.appendChild(s);
    }
    els.swatches.appendChild(frag);
    els.swatches.addEventListener('keydown', (e) => {
      if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
      e.preventDefault();
      const i = BACKGROUNDS.findIndex((b) => b.name === state.bg);
      const next = BACKGROUNDS[(i + (e.key === 'ArrowRight' ? 1 : -1) + BACKGROUNDS.length) % BACKGROUNDS.length];
      state.touched = true;
      setBackground(next.name);
      els.swatches.querySelector(`[aria-checked="true"]`)?.focus();
    });
  }

  function syncSwatches(scroll) {
    for (const s of els.swatches.children) {
      const on = s.dataset.name === state.bg;
      s.setAttribute('aria-checked', on);
      s.tabIndex = on ? 0 : -1;
      if (on && scroll) s.scrollIntoView({ block: 'nearest', inline: 'center' });
    }
  }

  function setBackground(name) {
    state.bg = name;
    syncSwatches(false);
    update();
  }

  // ---------- tabs & grid ----------
  function buildTabs() {
    els.tabs.textContent = '';
    state.tabThumbs = {};
    for (const c of visibleCats()) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab';
      b.id = `tab-${c.key}`;
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-controls', 'grid');
      b.dataset.key = c.key;
      const thumb = document.createElement('span');
      thumb.className = 'tab-thumb';
      const label = document.createElement('span');
      label.textContent = c.label;
      b.append(thumb, label);
      b.addEventListener('click', () => setTab(c.key));
      els.tabs.appendChild(b);
      state.tabThumbs[c.key] = thumb;
    }
    els.tabs.onkeydown = (e) => {
      if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
      const cats = visibleCats();
      const i = cats.findIndex((c) => c.key === state.tab);
      const next = cats[(i + (e.key === 'ArrowRight' ? 1 : -1) + cats.length) % cats.length];
      setTab(next.key);
      $(`tab-${next.key}`).focus();
    };
  }

  function syncTabs() {
    for (const b of els.tabs.children) {
      const on = b.dataset.key === state.tab;
      b.setAttribute('aria-selected', on);
      b.tabIndex = on ? 0 : -1;
      const key = b.dataset.key;
      const thumb = state.tabThumbs[key];
      const t = state.sel[key];
      if (thumb.dataset.url !== (t ? t.url : '')) {
        thumb.textContent = '';
        thumb.dataset.url = t ? t.url : '';
        thumb.classList.toggle('empty', !t);
        if (t) thumb.appendChild(cropImg(t, false));
      }
    }
  }

  function setTab(key, { scrollTo } = {}) {
    if (state.tab !== key) {
      state.tab = key;
      renderGrid();
      if (!scrollTo) els.gridWrap.scrollTop = 0;
    }
    syncTabs();
    $(`tab-${key}`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    if (scrollTo) {
      const tile = els.grid.querySelector(`[data-file="${CSS.escape(scrollTo)}"]`);
      tile?.scrollIntoView({ block: 'nearest' });
    }
  }

  function renderGrid() {
    const c = catByKey.get(state.tab);
    const list = state.traits[c.key] || [];
    els.sectionTitle.innerHTML = '';
    els.sectionTitle.append(c.label);
    const count = document.createElement('span');
    count.textContent = list.length;
    els.sectionTitle.appendChild(count);
    els.shuffleOne.setAttribute('aria-label', `Random ${c.label.toLowerCase()}`);

    const frag = document.createDocumentFragment();
    const addTile = (trait) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tile' + (trait ? '' : ' tile-none');
      b.setAttribute('role', 'radio');
      b.dataset.file = trait ? trait.file : '';
      const box = document.createElement('span');
      box.className = 'tile-img';
      if (trait) box.appendChild(cropImg(trait));
      else box.insertAdjacentHTML('beforeend', ICON_NONE);
      box.insertAdjacentHTML('beforeend', `<span class="check">${ICON_CHECK}</span>`);
      const name = document.createElement('span');
      name.className = 'tile-name';
      name.textContent = trait ? trait.name : 'None';
      b.title = trait ? trait.name : 'None';
      b.append(box, name);
      b.addEventListener('click', () => { state.touched = true; choose(c.key, trait); });
      frag.appendChild(b);
    };
    addTile(null);
    list.forEach(addTile);
    els.grid.textContent = '';
    els.grid.appendChild(frag);
    syncGrid();
  }

  function syncGrid() {
    const cur = state.sel[state.tab];
    for (const b of els.grid.children) {
      const on = (cur ? cur.file : '') === b.dataset.file;
      b.setAttribute('aria-checked', on);
    }
  }

  function choose(key, trait) {
    state.sel[key] = trait || null;
    update();
  }

  function update() {
    renderStage();
    updateCaption();
    syncTabs();
    syncGrid();
    writeUrl();
  }

  // ---------- shuffle ----------
  function shuffle() {
    for (const c of CATEGORIES) {
      const list = state.traits[c.key];
      state.sel[c.key] = c.optional || !list.length ? null : pick(list);
    }
    state.bg = pick(BACKGROUNDS).name;
    syncSwatches(true);
    update();
    preloadSome();
  }

  function shuffleOne() {
    const list = state.traits[state.tab];
    if (!list.length) return;
    let t = pick(list);
    if (list.length > 1) while (t === state.sel[state.tab]) t = pick(list);
    state.touched = true;
    choose(state.tab, t);
    els.grid.querySelector(`[data-file="${CSS.escape(t.file)}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // Warm the browser cache so the next Shuffle feels instant.
  function preloadSome() {
    if (EMBEDDED || (navigator.connection && navigator.connection.saveData)) return;
    const run = () => {
      for (const c of CATEGORIES) {
        if (c.optional) continue;
        const list = state.traits[c.key];
        if (list.length) { const i = new Image(); i.crossOrigin = 'anonymous'; i.src = pick(list).url; }
      }
    };
    if (window.requestIdleCallback) requestIdleCallback(run, { timeout: 2000 }); else setTimeout(run, 500);
  }

  // ---------- shareable link (URL hash) ----------
  // Some previews (sandboxed frames) forbid changing the address; never let that stop the app.
  function setHash(hash) {
    try { history.replaceState(null, '', hash); } catch { /* not allowed here */ }
  }

  function writeUrl() {
    const params = new URLSearchParams();
    for (const c of CATEGORIES) if (state.sel[c.key]) params.set(c.folder, state.sel[c.key].file);
    params.set('bg', state.bg);
    const hash = '#' + params.toString();
    if (location.hash !== hash) setHash(hash);
  }

  function readUrl(hash = location.hash) {
    if (hash.length < 2) return false;
    const params = new URLSearchParams(hash.slice(1));
    let applied = false;
    for (const c of CATEGORIES) {
      const file = params.get(c.folder);
      if (file == null) { state.sel[c.key] = null; continue; }
      const list = state.traits[c.key];
      const want = keyOf(file);
      const t = list.find((x) => x.file === file) || list.find((x) => keyOf(x.file) === want);
      state.sel[c.key] = t || null;
      if (t) applied = true;
    }
    const bg = params.get('bg');
    if (bg && bgByName.has(bg)) { state.bg = bg; applied = true; }
    return applied;
  }

  // ---------- search ----------
  let results = [];
  let activeIndex = -1;

  function search() {
    const q = stripAccents(els.search.value.trim().toLowerCase());
    els.suggestions.textContent = '';
    results = [];
    activeIndex = -1;
    if (q.length < 2) return closeSuggestions();

    const score = (name) => {
      const n = stripAccents(name.toLowerCase());
      if (n.startsWith(q)) return 3;
      if (n.split(/\s+/).some((w) => w.startsWith(q))) return 2;
      return n.includes(q) ? 1 : 0;
    };

    for (const ch of state.characters.values()) {
      const s = score(ch.name);
      if (s) results.push({ type: 'composition', name: ch.name, hint: `${Object.keys(ch.traits).length} features`, traits: ch.traits, thumb: ch.traits.hair || Object.values(ch.traits)[0], s });
    }
    for (const c of visibleCats()) {
      for (const t of state.traits[c.key]) {
        const s = score(t.name);
        if (s) results.push({ type: 'trait', name: t.name, hint: c.label, trait: t, thumb: t, s });
      }
    }
    for (const b of BACKGROUNDS) {
      const s = score(b.name);
      if (s) results.push({ type: 'bg', name: b.name, hint: 'Background', color: b.color, s });
    }

    const rank = { composition: 0, trait: 1, bg: 2 };
    results.sort((a, b) => rank[a.type] - rank[b.type] || b.s - a.s || a.name.localeCompare(b.name) || a.hint.localeCompare(b.hint));
    results = results.slice(0, 40);

    const frag = document.createDocumentFragment();
    if (!results.length) {
      const li = document.createElement('li');
      li.className = 'suggestion empty';
      li.textContent = 'No matches';
      frag.appendChild(li);
    }
    results.forEach((r, i) => {
      const li = document.createElement('li');
      li.id = `suggestion-${i}`;
      li.setAttribute('role', 'option');
      li.className = 'suggestion';
      const th = document.createElement('span');
      th.className = 's-thumb';
      if (r.thumb) th.appendChild(cropImg(r.thumb, false));
      if (r.color) th.style.background = r.color;
      const txt = document.createElement('span');
      txt.className = 's-text';
      const nm = document.createElement('span'); nm.className = 's-name'; nm.textContent = r.name;
      const hn = document.createElement('span'); hn.className = 's-hint'; hn.textContent = r.hint;
      txt.append(nm, hn);
      li.append(th, txt);
      if (r.type === 'composition') li.insertAdjacentHTML('beforeend', '<span class="s-tag">Full look</span>');
      li.addEventListener('mousedown', (e) => e.preventDefault());
      li.addEventListener('click', () => pickResult(i));
      frag.appendChild(li);
    });
    els.suggestions.appendChild(frag);
    els.suggestions.hidden = false;
    els.search.setAttribute('aria-expanded', 'true');
  }

  function closeSuggestions() {
    els.suggestions.hidden = true;
    els.search.setAttribute('aria-expanded', 'false');
    els.search.removeAttribute('aria-activedescendant');
  }

  function setActive(i) {
    const items = els.suggestions.querySelectorAll('.suggestion:not(.empty)');
    if (!items.length) return;
    activeIndex = (i + items.length) % items.length;
    items.forEach((el, j) => el.classList.toggle('active', j === activeIndex));
    items[activeIndex].scrollIntoView({ block: 'nearest' });
    els.search.setAttribute('aria-activedescendant', items[activeIndex].id);
  }

  function pickResult(i) {
    const r = results[i];
    if (!r) return;
    state.touched = true;
    if (r.type === 'composition') {
      for (const c of CATEGORIES) {
        if (c.optional) continue;
        if (r.traits[c.key]) state.sel[c.key] = r.traits[c.key];
      }
      update();
    } else if (r.type === 'bg') {
      state.bg = r.name;
      syncSwatches(true);
      update();
    } else {
      choose(r.trait.key, r.trait);
      setTab(r.trait.key, { scrollTo: r.trait.file });
    }
    els.search.value = '';
    closeSuggestions();
    els.search.blur();
  }

  function onSearchKey(e) {
    if (e.key === 'Escape') { els.search.value = ''; closeSuggestions(); return; }
    if (els.suggestions.hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIndex + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIndex - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); pickResult(activeIndex >= 0 ? activeIndex : 0); }
  }

  // ---------- export & share ----------
  let exported = null;

  const waitFor = (img) => img.complete
    ? Promise.resolve()
    : new Promise((r) => { img.addEventListener('load', r, { once: true }); img.addEventListener('error', r, { once: true }); });

  async function renderImage() {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = EXPORT_SIZE;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = (bgByName.get(state.bg) || BACKGROUNDS[0]).color;
    ctx.fillRect(0, 0, EXPORT_SIZE, EXPORT_SIZE);
    for (const key of LAYER_ORDER) {
      const img = state.layers[key];
      if (img.hidden || !img.getAttribute('src')) continue;
      await waitFor(img);
      if (!img.naturalWidth) continue;
      const scale = Math.min(EXPORT_SIZE / img.naturalWidth, EXPORT_SIZE / img.naturalHeight);
      const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
      ctx.drawImage(img, (EXPORT_SIZE - w) / 2, (EXPORT_SIZE - h) / 2, w, h);
    }
    return new Promise((resolve, reject) =>
      canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('Export failed'))), 'image/jpeg', 0.92));
  }

  function shareText() {
    const tags = ['#thecontroverse', ...describe().map((n) => '#' + stripAccents(n).replace(/[^a-zA-Z0-9]/g, ''))]
      .filter((t, i, a) => t.length > 1 && a.indexOf(t) === i);
    return `Check out my portrait creation on The controverse! ${tags.join(' ')}`;
  }

  const setStatus = (msg) => { els.status.textContent = msg; };

  async function openShare() {
    setStatus('Preparing image…');
    els.download.setAttribute('aria-disabled', 'true');
    els.preview.removeAttribute('src');
    if (typeof els.modal.showModal === 'function') els.modal.showModal(); else els.modal.setAttribute('open', '');
    try {
      const blob = await renderImage();
      if (exported) URL.revokeObjectURL(exported.url);
      exported = { blob, url: URL.createObjectURL(blob) };
      els.preview.src = exported.url;
      els.download.href = exported.url;
      els.download.removeAttribute('aria-disabled');
      setStatus('');
    } catch (err) {
      console.error(err);
      setStatus('Could not prepare the image. Please try again.');
    }
  }

  function closeShare() {
    if (typeof els.modal.close === 'function') els.modal.close(); else els.modal.removeAttribute('open');
  }

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {
      const ta = Object.assign(document.createElement('textarea'), { value: text });
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch { /* ignore */ }
      ta.remove();
      return ok;
    }
  }

  function triggerDownload() {
    if (!exported) return;
    const a = document.createElement('a');
    a.href = exported.url;
    a.download = 'the-controverse-portrait.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  async function shareInstagram() {
    if (!exported) return;
    const text = shareText();
    const file = new File([exported.blob], 'the-controverse-portrait.jpg', { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await copy(text);
      try {
        await navigator.share({ files: [file], text });
        setStatus('Caption copied. Paste it in Instagram.');
      } catch (err) {
        if (err.name !== 'AbortError') setStatus('Sharing was blocked. Use Download image instead.');
      }
      return;
    }
    triggerDownload();
    const copied = await copy(text);
    window.open('https://www.instagram.com/', '_blank', 'noopener');
    setStatus(`Image downloaded${copied ? ' and caption copied' : ''}. Create a new post on Instagram and upload it.`);
  }

  function bindShare() {
    els.share.addEventListener('click', openShare);
    els.close.addEventListener('click', closeShare);
    els.modal.addEventListener('click', (e) => { if (e.target === els.modal) closeShare(); });
    els.instagram.addEventListener('click', shareInstagram);
    if (EMBEDDED) {
      els.download.addEventListener('click', () => setStatus('Downloads are switched off in this preview. Use the live site to save the image.'));
    }
    els.x.addEventListener('click', () => {
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(location.href)}`, '_blank', 'noopener');
    });
    els.linkedin.addEventListener('click', async () => {
      await copy(shareText());
      setStatus('Text copied. Paste it into your LinkedIn post.');
      window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(location.href)}`, '_blank', 'noopener');
    });
    els.copy.addEventListener('click', async () => {
      setStatus((await copy(`${shareText()} ${location.href}`)) ? 'Copied to clipboard.' : 'Copy failed.');
    });
  }

  // ---------- start ----------
  function load(paths, { first }) {
    const filesKey = paths.join('|');
    if (filesKey === state.filesKey) return;
    state.filesKey = filesKey;
    buildTraits(paths);
    buildTabs();
    renderGrid();
    if (first) {
      if (!readUrl()) return shuffle();
    } else if (!state.touched && initialHash.length > 1) {
      // a shared link may point to files that only the live list knows about
      readUrl(initialHash);
    }
    syncSwatches(true);
    update();
  }

  function isTyping(e) {
    const t = e.target;
    return t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  }

  function init() {
    buildLayers();
    buildSwatches();
    bindShare();
    els.shuffle.addEventListener('click', () => { state.touched = true; shuffle(); });
    els.shuffleOne.addEventListener('click', shuffleOne);
    els.search.addEventListener('input', search);
    els.search.addEventListener('focus', search);
    els.search.addEventListener('keydown', onSearchKey);
    els.search.addEventListener('blur', () => setTimeout(closeSuggestions, 150));
    window.addEventListener('hashchange', () => { if (readUrl()) { syncSwatches(true); update(); } });
    document.addEventListener('keydown', (e) => {
      if (isTyping(e) || e.metaKey || e.ctrlKey || e.altKey || els.modal.open) return;
      if (e.key === '/') { e.preventDefault(); els.search.focus(); }
      else if (e.key.toLowerCase() === 's') { state.touched = true; shuffle(); }
    });

    const cached = EMBEDDED ? null : readCache();
    const fresh = cached && Date.now() - cached.t < CACHE_TTL;
    load(cached && cached.paths && cached.paths.length ? cached.paths : SNAPSHOT, { first: true });

    if (!fresh && !EMBEDDED) {
      fetchTree()
        .then((paths) => { if (paths.length) { writeCache(paths); load(paths, { first: false }); } })
        .catch((err) => console.info('Using saved asset list:', err.message));
    }
  }

  init();
})();
</script>
</body>
</html>
